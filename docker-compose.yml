services:
  mysql_db:
    image: mysql:8.0
    container_name: mysql_instituto
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: gestion_instituto
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  postgres_db:
    image: postgres:15
    container_name: postgres_instituto
    restart: always
    environment:
      POSTGRES_DB: gestion_instituto
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: rootpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mariadb_db:
    image: mariadb:10.11
    container_name: mariadb_instituto
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: rootpassword
      MARIADB_DATABASE: gestion_instituto
    ports:
      - "3307:3306"
    volumes:
      - mariadb_data:/var/lib/mysql

volumes:
  mysql_data:
  postgres_data:
  mariadb_data: